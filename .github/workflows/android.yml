name: Build APK & web

# Setiap perubahan kode membangun APK DAN versi web dari kode yang sama,
# lalu menerbitkan keduanya: APK ke GitHub Releases, web ke GitHub Pages (branch gh-pages).
on:
  push:
    branches: ['**', '!gh-pages']
  workflow_dispatch:

permissions:
  contents: write

# Satu rilis berjalan pada satu waktu, supaya APK dan web selalu berasal dari commit yang sama.
concurrency:
  group: rilis
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      VITE_APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang dependensi
        run: npm ci

      - name: Build aplikasi web
        run: npm run build

      - name: Salin ke proyek Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Beri nama file APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "BelajarJepang-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: BelajarJepang-${{ env.VERSION_NAME }}
          path: BelajarJepang-*.apk

      - name: Terbitkan rilis APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Belajar Jepang ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: BelajarJepang-*.apk
          body: |
            APK aplikasi Belajar Jepang (build dari branch `${{ github.ref_name }}`, commit ${{ github.sha }}).
            Versi web yang sama: https://jonathan12345salim.github.io/belajar-jepang/

            **Cara pasang di HP Android:**
            1. Unduh file `BelajarJepang-${{ env.VERSION_NAME }}.apk` di bagian **Assets** di bawah.
            2. Buka file yang sudah diunduh. Jika muncul peringatan, izinkan "Instal aplikasi tidak dikenal" untuk browser/file manager yang dipakai.
            3. Ketuk **Instal**. Versi baru bisa langsung dipasang di atas versi lama tanpa kehilangan progres.

      # Branch gh-pages hanya berisi hasil build web (dibuat ulang setiap rilis).
      - name: Terbitkan versi web (GitHub Pages)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898333+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Web ${VERSION_NAME} dari ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
